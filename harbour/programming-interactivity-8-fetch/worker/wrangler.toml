# Harbour Market API · npx wrangler deploy
name = "harbour-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false   # only https://harbour-api.lopin.me, no *.workers.dev URL

# https://harbour-api.lopin.me (lopin.me is on Cloudflare DNS)
routes = [
  { pattern = "harbour-api.lopin.me", custom_domain = true }
]

[[durable_objects.bindings]]
name = "MARKET"
class_name = "Market"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Market"]
