<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Courier · Fleet</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "leaflet": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js" } }
  </script>
</head>
<body>
  <header>
    <h1>Courier</h1>
    <p>You deliver food in Barcelona. Your phone reports where you are, once a second.</p>
  </header>

  <main>
    <form id="start">
      <label>Your name, as the dispatcher will see it
        <input name="name" required maxlength="24" autocomplete="nickname">
      </label>
      <button>Start your shift</button>
    </form>

    <div class="bar">
      <span>Order <span id="order-id" class="order-id">–</span></span>
      <span id="route"></span>
      <span id="order-status"></span>
    </div>
    <p id="status" role="status">Not connected.</p>

    <div id="map"></div>

    <section aria-labelledby="notes-title">
      <h2 id="notes-title">From the customer</h2>
      <ol id="notes"></ol>
    </section>
  </main>

  <script type="module" src="courier.js"></script>
</body>
</html>
