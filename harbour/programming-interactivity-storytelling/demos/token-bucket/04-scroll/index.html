<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Token bucket · 04 · scroll-driven</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Why was the burst refused?</h1>
    <p class="lede">Step 04 · scroll-driven. The same steps as 03; the scroll position chooses the step.</p>

    <div class="scrolly">
      <div class="sticky">
        <div class="figure">
          <svg id="bucket" viewBox="0 0 140 305" role="img"></svg>
          <svg id="timeline" viewBox="0 0 800 250" role="img"></svg>
        </div>
        <ul class="legend">
          <li><span style="background: var(--level)"></span>tokens</li>
          <li><span style="background: var(--ok)"></span>accepted</li>
          <li><span style="background: var(--refused)"></span>refused ✕</li>
        </ul>
        <p id="sentence" class="sentence"></p>
        <p id="announce" class="sr-only" aria-live="polite"></p>
        <div class="controls">
          <label data-control="cursor">Time <input id="cursor" type="range" min="0" max="10" step="0.1"><span id="cursor-out" class="out"></span></label>
          <label data-control="capacity">Capacity <input id="capacity" type="range" min="1" max="8" step="1"><span id="capacity-out" class="out"></span></label>
          <label data-control="rate">Refill rate <input id="rate" type="range" min="0.25" max="4" step="0.05"><span id="rate-out" class="out"></span></label>
          <div data-control="edit" class="row">
            <button id="add">Add a request at the cursor</button>
            <button id="clear">Remove all</button>
          </div>
        </div>
      </div>

      <!-- main.js fills one <section> per step from steps.js -->
      <div id="steps" class="steps"></div>
    </div>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
