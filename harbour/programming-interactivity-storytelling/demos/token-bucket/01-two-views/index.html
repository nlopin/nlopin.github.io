<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Token bucket · 01 · one state, three views</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>A token bucket</h1>
    <p class="lede">Step 01 · one state, three views. Drag time.</p>

    <div class="figure">
      <svg id="bucket" viewBox="0 0 140 305" role="img"></svg>
      <svg id="timeline" viewBox="0 0 800 250" role="img"></svg>
    </div>
    <ul class="legend">
      <li><span style="background: var(--level)"></span>tokens in the bucket</li>
      <li><span style="background: var(--ok)"></span>request accepted</li>
      <li><span style="background: var(--refused)"></span>request refused ✕</li>
    </ul>
    <p id="sentence" class="sentence"></p>
    <p id="announce" class="sr-only" aria-live="polite"></p>

    <div class="controls">
      <label>Time <input id="cursor" type="range" min="0" max="10" step="0.1"><span id="cursor-out" class="out"></span></label>
    </div>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
