<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parley · level meter on the bench · step 3</title>
  <link rel="stylesheet" href="bench.css">
  <link rel="stylesheet" href="level-meter.css">
  <script type="module" src="level-meter.js"></script>
  <script type="module" src="main.js"></script>
</head>
<body>
  <h1>&lt;level-meter&gt; on the bench</h1>

  <level-meter value="0.3"></level-meter>
  <level-meter value="0.7" bars="20"></level-meter>

  <!-- Fake data: the microphone isn't connected yet. -->
  <div class="dev">
    <label>Fake microphone <input id="fake" type="range" min="0" max="1" step="0.01" value="0.3"></label>
  </div>

  <!-- In the console:
       const meter = document.querySelector("level-meter");
       meter.setAttribute("value", 0.8)   // attribute → attributeChangedCallback
       meter.value = 0.5                  // property → the setter
       meter.getAttribute("value")        // still "0.8": the property doesn't write the attribute
  -->
</body>
</html>
