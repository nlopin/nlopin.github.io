<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parley · green room · step 5</title>
  <link rel="stylesheet" href="app.css">
  <script type="module" src="level-meter.js"></script>
  <script type="module" src="main.js"></script>
</head>
<body>
  <header class="bar">
    <strong class="logo">Parley</strong>
    <span class="chip">Weekly design review</span>
    <span class="chip">4 waiting</span>
    <button id="theme" type="button">Dark theme</button>
  </header>

  <main class="green-room">
    <h1>Ready to join?</h1>

    <form id="join">
      <camera-preview mirrored></camera-preview>

      <div class="controls">
        <span class="label">Microphone level</span>
        <level-meter value="0.3"></level-meter>

        <span class="label">Microphone</span>
        <device-picker kind="audioinput" name="mic" required></device-picker>

        <button>Join</button>
      </div>
    </form>

    <details class="dev" open>
      <summary>Fake data</summary>
      <label>Microphone <input id="fake" type="range" min="0" max="1" step="0.01" value="0.3"></label>
    </details>
  </main>
</body>
</html>
