<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jam · theremin-pad</title>
  <style>
    body { margin: 40px; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    theremin-pad { max-width: 720px; }
    #log { font: 13px/1.5 ui-monospace, monospace; white-space: pre; color: #5d6576; }
  </style>
  <script type="module" src="theremin-pad.js"></script>
</head>
<body>
  <h1>Theremin</h1>

  <p>
    <label>Wave
      <select id="wave">
        <option>sine</option><option>square</option><option>sawtooth</option><option selected>triangle</option>
      </select>
    </label>
  </p>

  <theremin-pad wave="triangle" low="110" high="880"></theremin-pad>

  <h2>Events</h2>
  <pre id="log"></pre>

  <script type="module">
    const pad = document.querySelector("theremin-pad");
    const log = document.querySelector("#log");

    document.querySelector("#wave").addEventListener("change", (event) => {
      pad.wave = event.target.value;
    });

    // "note" fires every frame while it plays: show the latest one only.
    pad.addEventListener("note", (event) => {
      log.textContent = `note ${JSON.stringify(event.detail)}`;
    });
  </script>
</body>
</html>
