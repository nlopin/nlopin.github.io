<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jam · clap-switch</title>
  <style>
    body { margin: 40px; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #0f1218; color: #9aa3b5; transition: background 0.3s, color 0.3s; }
    body.lit { background: #fffbea; color: #161a22; }
    clap-switch { max-width: 520px; padding: 16px; border-radius: 12px; background: #fff; color: #161a22; }
    /* the element reflects its state as an attribute, so the page can style it */
    clap-switch[on] { outline: 3px solid #f5b301; }
    #log { font: 13px/1.5 ui-monospace, monospace; white-space: pre; }
  </style>
  <script type="module" src="clap-switch.js"></script>
</head>
<body>
  <h1>Clap switch</h1>

  <clap-switch claps="2" threshold="0.5"></clap-switch>

  <p>
    <label>Microphone
      <select id="device"><option value="">Default microphone</option></select>
    </label>
  </p>

  <p>
    <label>Threshold
      <input id="threshold" type="range" min="0.05" max="1" step="0.05" value="0.5">
      <output for="threshold">0.5</output>
    </label>
  </p>

  <h2>Events</h2>
  <pre id="log"></pre>

  <script type="module">
    const clap = document.querySelector("clap-switch");
    const range = document.querySelector("#threshold");
    const log = document.querySelector("#log");
    const device = document.querySelector("#device");

    // Names appear only after the microphone is allowed: list again when the permission or the devices change.
    async function listMicrophones() {
      const all = await navigator.mediaDevices.enumerateDevices();
      // "default" and "communications" are Chrome's aliases for a device listed again under its own id.
      const mics = all.filter((d) => d.kind === "audioinput" && d.deviceId && !["default", "communications"].includes(d.deviceId));
      const chosen = device.value;
      device.replaceChildren(
        new Option("Default microphone", ""),
        ...mics.map((mic, i) => new Option(mic.label || `Microphone ${i + 1}`, mic.deviceId)),
      );
      device.value = mics.some((mic) => mic.deviceId === chosen) ? chosen : "";
    }

    if (navigator.mediaDevices) {
      listMicrophones();
      navigator.mediaDevices.addEventListener("devicechange", listMicrophones);
      navigator.permissions
        .query({ name: "microphone" })
        .then((status) => status.addEventListener("change", listMicrophones))
        .catch(() => {}); // this browser doesn't know the permission name
    }

    device.addEventListener("change", () => {
      clap.device = device.value;
    });

    range.addEventListener("input", () => {
      clap.threshold = range.value;
      range.nextElementSibling.value = range.value;
    });

    // The element only reports; the page turns the light on.
    clap.addEventListener("toggle", (event) => {
      document.body.classList.toggle("lit", event.detail.on);
    });

    for (const type of ["clap", "toggle"]) {
      clap.addEventListener(type, (event) => {
        const line = `${type} ${JSON.stringify(event.detail)}`;
        log.textContent = [line, ...log.textContent.split("\n")].slice(0, 50).join("\n");
      });
    }
  </script>
</body>
</html>
